name: Build release APK

# Builds a signed APK and attaches it to the GitHub release, so Obtainium can
# pick it up. Signing uses this fork's own keystore, not upstream's.
on:
  release:
    types:
      - published

jobs:
  build_apk:
    name: Build signed APK and attach to release
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter version
        run: echo "VERSION=$(cat .flutter-version)" >> $GITHUB_ENV

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.VERSION }}

      - name: Install dependencies
        run: |
          flutter config --no-analytics
          flutter pub get

      - name: Configure keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release-keystore.jks
          echo "storeFile=release-keystore.jks" >> key.properties
          echo "keyAlias=$KEY_ALIAS" >> key.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> key.properties
          echo "keyPassword=$KEY_PASSWORD" >> key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: android

      - name: Build APK
        run: flutter build apk --release

      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
