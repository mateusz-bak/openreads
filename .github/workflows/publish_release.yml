name: Publish release

on:
  pull_request:
    types:
      - closed
    branches:
      - master

permissions:
  contents: write

env:
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DO_NOT_TRACK: '1'

jobs:
  publish_github_release:
    name: Publish draft release
    # only merged release PRs created by the Prepare release workflow
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v') &&
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - name: Publish draft release with the tag on the merge commit
        id: publish
        run: |
          TAG="${HEAD_REF#release/}"
          ID="$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id")"
          if [ -z "$ID" ] || [[ "$ID" == *$'\n'* ]]; then
            echo "::error::Expected one draft release for $TAG"
            exit 1
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -f target_commitish="$MERGE_SHA" -F draft=false > /dev/null
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}

  build_github:
    name: Build split apks and attach to release
    needs: publish_github_release
    runs-on: ubuntu-26.04

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter version
        run: echo "VERSION=$(cat .flutter-version)" >> $GITHUB_ENV

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.VERSION }}

      - name: Install dependencies
        run: |
          flutter config --no-analytics
          dart --disable-analytics
          flutter pub get

      - name: Configure Keystore for Android
        run: |
          echo "$PLAY_STORE_UPLOAD_KEY" | base64 --decode > app/upload-keystore.jks
          echo "storeFile=upload-keystore.jks" >> key.properties
          echo "keyAlias=$KEYSTORE_KEY_ALIAS" >> key.properties
          echo "storePassword=$KEYSTORE_STORE_PASSWORD" >> key.properties
          echo "keyPassword=$KEYSTORE_KEY_PASSWORD" >> key.properties
        env:
          PLAY_STORE_UPLOAD_KEY: ${{ secrets.PLAY_STORE_UPLOAD_KEY }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
        working-directory: android

      - name: Build full APK
        run: flutter build apk --release

      - name: Build APKs split per abi
        run: flutter build apk --release --split-per-abi

      - name: Rename output files
        run: |
          mv "build/app/outputs/flutter-apk/app-release.apk" "build/app/outputs/flutter-apk/openreads-${{ needs.publish_github_release.outputs.tag }}-release.apk"
          mv "build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk" "build/app/outputs/flutter-apk/openreads-${{ needs.publish_github_release.outputs.tag }}-armeabi-v7a-release.apk"
          mv "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" "build/app/outputs/flutter-apk/openreads-${{ needs.publish_github_release.outputs.tag }}-arm64-v8a-release.apk"
          mv "build/app/outputs/flutter-apk/app-x86_64-release.apk" "build/app/outputs/flutter-apk/openreads-${{ needs.publish_github_release.outputs.tag }}-x86_64-release.apk"

      - name: Attach apk files and project info
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.publish_github_release.outputs.tag }}
          body_path: assets/project_info.md
          append_body: true
          files: |
            build/app/outputs/flutter-apk/openreads-${{ needs.publish_github_release.outputs.tag }}-release.apk
            build/app/outputs/flutter-apk/openreads-${{ needs.publish_github_release.outputs.tag }}-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/openreads-${{ needs.publish_github_release.outputs.tag }}-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/openreads-${{ needs.publish_github_release.outputs.tag }}-x86_64-release.apk

  build_linux:
    name: Build Linux bundle and attach to release
    needs: publish_github_release
    # older Ubuntu (glibc) so the binary runs on more distributions
    runs-on: ubuntu-24.04

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter version
        run: echo "VERSION=$(cat .flutter-version)" >> $GITHUB_ENV

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.VERSION }}

      - name: Install dependencies
        run: |
          flutter config --no-analytics
          dart --disable-analytics
          flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Pack bundle
        run: |
          mv build/linux/x64/release/bundle build/linux/x64/release/openreads
          tar -czf "openreads-${{ needs.publish_github_release.outputs.tag }}-linux-x64.tar.gz" -C build/linux/x64/release openreads

      - name: Attach Linux bundle
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.publish_github_release.outputs.tag }}
          files: openreads-${{ needs.publish_github_release.outputs.tag }}-linux-x64.tar.gz

  build_google_play:
    name: Build appbundle and upload to Google Play
    needs: publish_github_release
    runs-on: ubuntu-26.04

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter version
        run: echo "VERSION=$(cat .flutter-version)" >> $GITHUB_ENV

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.VERSION }}

      - name: Install dependencies
        run: |
          flutter config --no-analytics
          dart --disable-analytics
          flutter pub get

      - name: Configure Keystore for Android
        run: |
          echo "$PLAY_STORE_UPLOAD_KEY" | base64 --decode > app/upload-keystore.jks
          echo "storeFile=upload-keystore.jks" >> key.properties
          echo "keyAlias=$KEYSTORE_KEY_ALIAS" >> key.properties
          echo "storePassword=$KEYSTORE_STORE_PASSWORD" >> key.properties
          echo "keyPassword=$KEYSTORE_KEY_PASSWORD" >> key.properties
        env:
          PLAY_STORE_UPLOAD_KEY: ${{ secrets.PLAY_STORE_UPLOAD_KEY }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
        working-directory: android

      - name: Build appbundle
        run: flutter build appbundle --release

      - name: Create whatsnew file
        run: |
          mkdir whatsnew
          export RELEASE_BUILD="$(cat pubspec.yaml | grep '^version:' | awk '{print $2}' | cut -d '+' -f2)"
          cp fastlane/metadata/android/en-US/changelogs/$RELEASE_BUILD.txt whatsnew/whatsnew-en-US

      - name: Create release in Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: software.mdev.bookstracker
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: production
          userFraction: 0.99999
          status: inProgress
          whatsNewDirectory: whatsnew
          mappingFile: build/app/outputs/mapping/release/mapping.txt
          debugSymbols: build/app/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib
