name: Test build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  android_apk_build:
    name: Android apk
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Set up Flutter version
      run: echo "VERSION=$(cat .flutter-version)" >> $GITHUB_ENV

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.VERSION }}
        cache: true
        pub-cache: true

    - name: Remove signing config
      run: awk '/release \{/ {f=1} !f; /}/ && f {f=0}' build.gradle > temp && mv temp build.gradle
      working-directory: android/app

    - name: Configure Flutter
      run: flutter config --no-analytics

    - name: Get Flutter packages
      run: flutter pub get

    - name: Build APK
      run: flutter build apk

  android_appbundle_build:
    name: Android appbundle
    if: github.event_name == 'push' # compiles the same code as the apk job
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Set up Flutter version
      run: echo "VERSION=$(cat .flutter-version)" >> $GITHUB_ENV

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.VERSION }}
        cache: true
        pub-cache: true

    - name: Remove signing config
      run: awk '/release \{/ {f=1} !f; /}/ && f {f=0}' build.gradle > temp && mv temp build.gradle
      working-directory: android/app

    - name: Configure Flutter
      run: flutter config --no-analytics

    - name: Get Flutter packages
      run: flutter pub get

    - name: Build appbundle
      run: flutter build appbundle

  ios_build:
    name: iOS ipa
    runs-on: macos-15
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Flutter version
      run: echo "VERSION=$(cat .flutter-version)" >> $GITHUB_ENV

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.VERSION }}
        cache: true
        pub-cache: true

    - name: Configure Flutter
      run: flutter config --no-analytics

    - name: Get Flutter packages
      run: flutter pub get

    - name: Build iOS (simulator)
      if: github.event_name == 'pull_request'
      run: flutter build ios --simulator --debug # much faster than a release build

    - name: Build iOS (release)
      if: github.event_name == 'push'
      run: flutter build ios --release --no-codesign

  linux_build:
    name: Linux executable
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Install Linux dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

    - name: Set up Flutter version
      run: echo "VERSION=$(cat .flutter-version)" >> $GITHUB_ENV

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.VERSION }}
        cache: true
        pub-cache: true

    - name: Configure Flutter
      run: flutter config --no-analytics

    - name: Get Flutter packages
      run: flutter pub get

    - name: Build Linux
      run: flutter build linux --debug
