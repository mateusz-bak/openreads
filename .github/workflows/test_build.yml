name: Test build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DO_NOT_TRACK: '1'

jobs:
  android_apk_build:
    name: Android apk
    runs-on: ubuntu-26.04
    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up Java
      uses: actions/setup-java@v6
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Set up Flutter
      uses: ./.github/actions/setup_flutter

    - name: Build APK
      run: flutter build apk ${{ github.event_name == 'pull_request' && '--target-platform android-arm64' || '' }}

  android_appbundle_build:
    name: Android appbundle
    if: github.event_name == 'push' # compiles the same code as the apk job
    runs-on: ubuntu-26.04
    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up Java
      uses: actions/setup-java@v6
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Set up Flutter
      uses: ./.github/actions/setup_flutter

    - name: Build appbundle
      run: flutter build appbundle

  ios_build:
    name: iOS ipa
    runs-on: macos-26
    env:
      COCOAPODS_DISABLE_STATS: 'true'
    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up Flutter
      uses: ./.github/actions/setup_flutter

    - name: Build iOS (simulator)
      if: github.event_name == 'pull_request'
      run: flutter build ios --simulator --debug # much faster than a release build

    - name: Build iOS (release)
      if: github.event_name == 'push'
      run: flutter build ios --release --no-codesign

  linux_build:
    name: Linux executable
    runs-on: ubuntu-26.04
    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Install Linux dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

    - name: Set up Flutter
      uses: ./.github/actions/setup_flutter

    - name: Build Linux
      run: flutter build linux --debug
