name: openreads
description: A mobile books tracker written in Flutter. Free, private and open source.

publish_to: "none"

version: 2.12.0+60

environment:
  sdk: ">=2.18.2 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  flutter_rating_bar: ^4.0.1
  sqflite: ^2.4.6
  sqflite_common_ffi: ^2.4.7
  path_provider: ^2.1.6
  rxdart: ^0.28.0
  path: ^1.9.1
  flutter_displaymode: ^0.7.0
  image_picker: ^1.2.4
  image_cropper: ^13.0.0
  flutter_bloc: ^9.1.1
  image: ^4.13.1
  fl_chart: ^1.3.1
  dropdown_button2: ^3.1.0
  equatable: ^2.1.0
  connectivity_plus: ^7.3.2
  http: ^1.6.0
  cached_network_image: ^3.4.1
  loading_animation_widget: ^1.3.0
  infinite_scroll_pagination: ^5.1.1
  settings_ui: ^3.0.1
  url_launcher: ^6.3.3
  font_awesome_flutter: ^11.0.0
  hydrated_bloc: ^11.0.0
  permission_handler: ^13.0.2
  filesystem_picker: ^4.1.0
  archive: ^4.7.1
  share_plus: ^13.3.1
  device_info_plus: ^13.3.0
  dynamic_color: ^1.9.0
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.6
  easy_localization: ^3.0.8
  flutter_typeahead: ^6.0.0
  flex_color_picker: ^3.8.0
  diacritic: ^0.1.6
  flutter_speed_dial: ^7.0.0
  blurhash_dart: ^1.2.1
  csv: ^8.0.0
  html: ^0.15.7
  file_picker: ^13.3.3
  smooth_page_indicator: ^3.0.0
  intl: ^0.20.3
  dotted_border: ^3.1.0
  flutter_cache_manager: ^3.5.0
  modal_bottom_sheet: ^3.0.0
  saf_stream: ^4.0.3
  saf_util: ^3.1.1
  
  flutter_localizations:
    sdk: flutter
  xdg_directories: ^1.1.0
  flutter_zxing: ^3.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# use the system SQLite like sqlite3 2.x did (Linux needs libsqlite3), instead
# of downloading prebuilt binaries at build time and bundling them in every app
hooks:
  user_defines:
    sqlite3:
      source: system

flutter_launcher_icons:
  image_path: "./assets/icons/icon.png"
  adaptive_icon_foreground: "./assets/icons/icon.png"
  adaptive_icon_background: "#00BFA6"
  min_sdk_android: 21
  android: "launcher_icon"
  ios: true
  image_path_ios: "./assets/icons/gplay-icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/translations/
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
    - family: SofiaSans
      fonts:
        - asset: assets/fonts/SofiaSans-Regular.ttf
        - asset: assets/fonts/SofiaSans-Bold.ttf
          weight: 700
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Raleway
      fonts:
        - asset: assets/fonts/Raleway-Regular.ttf
        - asset: assets/fonts/Raleway-Bold.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
    - family: Kanit
      fonts:
        - asset: assets/fonts/Kanit-Regular.ttf
        - asset: assets/fonts/Kanit-Bold.ttf
          weight: 700
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Regular.ttf
        - asset: assets/fonts/Lora-Bold.ttf
          weight: 700
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-Regular.ttf
        - asset: assets/fonts/Quicksand-Bold.ttf
          weight: 700
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Jost
      fonts:
        - asset: assets/fonts/Jost-Regular.ttf
        - asset: assets/fonts/Jost-Bold.ttf
          weight: 700
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/Atkinson-Hyperlegible-Regular-102.ttf
        - asset: assets/fonts/Atkinson-Hyperlegible-Bold-102.ttf
          weight: 700
    - family: OpenDyslexic
      fonts:
